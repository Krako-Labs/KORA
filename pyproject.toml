[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kora"
version = "0.1.0a0"
description = "Open-source execution control for AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "hkalbertkim" },
]
maintainers = [
  { name = "hkalbertkim" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic",
  "jsonschema",
]

[project.urls]
Homepage = "https://github.com/Krako-Labs/KORA"
Repository = "https://github.com/Krako-Labs/KORA"
Issues = "https://github.com/Krako-Labs/KORA/issues"

[project.scripts]
kora = "kora.cli:main"

[project.optional-dependencies]
rust = [
    "setuptools-rust>=1.5",
    "cffi>=1.15",
]
openai = [
  "requests",
]
dev = [
  "pytest",
  "psutil",
]
benchmark = [
  "psutil",
]

[tool.setuptools.packages.find]
include = ["kora"]

[tool.setuptools.package-data]
kora = ["studio_assets/*.css", "studio_assets/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.setuptools-rust.ext-modules]]
target = "kora_rust"
path = "kora-rust/Cargo.toml"
binding = "PyO3"



