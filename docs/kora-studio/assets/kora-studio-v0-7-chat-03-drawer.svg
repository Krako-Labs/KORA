<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">KORA Studio v0.7 Chat-First Board 03 - Right Drawer</title>
  <desc id="desc">Minimal collapsible right drawer for advanced details.</desc>
  <defs><style>.bg{fill:#0f1115}.main{fill:#11151c;stroke:#242b36;stroke-width:1.5;rx:18}.drawer{fill:#171a21;stroke:#38bdf8;stroke-width:2;rx:18}.card{fill:#1d222b;stroke:#384151;stroke-width:1.5;rx:14}.input{fill:#20242d;stroke:#424a58;stroke-width:1.5;rx:24}.text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8edf5}.h1{font-size:34px;font-weight:720}.h2{font-size:22px;font-weight:680}.small{font-size:16px;fill:#b5bfcd}.tiny{font-size:13px;fill:#8f9aaa}.pill{fill:#20242d;stroke:#3b4452;stroke-width:1.2;rx:15}.danger{fill:#2a1416;stroke:#ef4444;stroke-width:1.5;rx:14}</style></defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="text h1" x="60" y="70">03. Collapsible Right Drawer</text>
  <text class="text small" x="60" y="104">Advanced details slide in only when the user asks.</text>
  <rect class="main" x="60" y="150" width="760" height="470"/>
  <rect class="pill" x="104" y="190" width="250" height="36"/><text class="text tiny" x="128" y="213">Selected: Qwen 2.5 7B</text>
  <text class="text h2" x="260" y="342">Main work stays clean</text>
  <rect class="input" x="160" y="420" width="560" height="66"/><text class="text small" x="190" y="461">Ask KORA...</text>
  <rect class="drawer" x="850" y="150" width="290" height="470"/>
  <text class="text h2" x="882" y="196">Details</text>
  <rect class="card" x="882" y="230" width="226" height="64"/><text class="text tiny" x="904" y="258">Runtime</text><text class="text tiny" x="904" y="278">service not connected</text>
  <rect class="card" x="882" y="316" width="226" height="64"/><text class="text tiny" x="904" y="344">Route trace</text><text class="text tiny" x="904" y="364">generated harness only</text>
  <rect class="card" x="882" y="402" width="226" height="64"/><text class="text tiny" x="904" y="430">Report</text><text class="text tiny" x="904" y="450">preview only</text>
  <rect class="danger" x="882" y="502" width="226" height="66"/><text class="text tiny" x="904" y="530">No model execution</text><text class="text tiny" x="904" y="550">No provider calls</text>
  <text class="text h2" x="60" y="720">Decision</text>
  <text class="text small" x="60" y="752">Move complexity into a right drawer. Default state should stay nearly empty.</text>
</svg>
