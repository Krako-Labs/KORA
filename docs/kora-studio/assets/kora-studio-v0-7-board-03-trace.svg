<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">KORA Studio v0.7 Minimal Board 03 - Trace</title>
  <desc id="desc">Minimal execution trace board.</desc>
  <defs><style>.bg{fill:#0b0f14}.panel{fill:#10161f;stroke:#2b3544;stroke-width:2;rx:16}.row{fill:#151d28;stroke:#334155;stroke-width:2;rx:12}.active{fill:#172637;stroke:#38bdf8;stroke-width:2;rx:12}.text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d8e0eb}.h1{font-size:38px;font-weight:760;fill:#f8fafc}.h2{font-size:24px;font-weight:720}.small{font-size:16px;fill:#aeb8c6}.tiny{font-size:13px;fill:#8d9bae}.line{stroke:#38bdf8;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="text h1" x="56" y="70">03. Execution Trace</text>
  <text class="text small" x="56" y="104">Make the router visible. Do not show it as chat.</text>
  <rect class="panel" x="56" y="150" width="1088" height="470"/>
  <path class="line" d="M160 286 H1010"/>
  <rect class="active" x="100" y="230" width="170" height="112"/><text class="text small" x="124" y="278">request</text><text class="text tiny" x="124" y="306">received</text>
  <rect class="row" x="310" y="230" width="170" height="112"/><text class="text small" x="334" y="278">route</text><text class="text tiny" x="334" y="306">selected</text>
  <rect class="row" x="520" y="230" width="170" height="112"/><text class="text small" x="544" y="278">check</text><text class="text tiny" x="544" y="306">deterministic</text>
  <rect class="row" x="730" y="230" width="170" height="112"/><text class="text small" x="754" y="278">validate</text><text class="text tiny" x="754" y="306">pass/fail</text>
  <rect class="row" x="940" y="230" width="150" height="112"/><text class="text small" x="964" y="278">finish</text><text class="text tiny" x="964" y="306">counters</text>
  <rect class="row" x="100" y="412" width="990" height="92"/>
  <text class="text h2" x="130" y="452">Boundary</text>
  <text class="text small" x="130" y="486">Generated harness events only. Not model token streaming. No provider output.</text>
  <text class="text h2" x="56" y="698">Decision</text>
  <text class="text small" x="56" y="730">Timeline should be one clean horizontal/vertical path, not many cards.</text>
</svg>
