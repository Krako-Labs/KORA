<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">KORA Studio v0.7 Chat-First Board 02 - Model Picker</title>
  <desc id="desc">Minimal open-source LLM search and selected model label board.</desc>
  <defs><style>.bg{fill:#0f1115}.box{fill:#171a21;stroke:#2b313c;stroke-width:1.5;rx:18}.item{fill:#1b1f28;stroke:#343b48;stroke-width:1.5;rx:14}.active{fill:#182838;stroke:#38bdf8;stroke-width:2;rx:14}.search{fill:#20242d;stroke:#424a58;stroke-width:1.5;rx:22}.text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8edf5}.h1{font-size:34px;font-weight:720}.h2{font-size:22px;font-weight:680}.small{font-size:16px;fill:#b5bfcd}.tiny{font-size:13px;fill:#8f9aaa}.pill{fill:#10251f;stroke:#22c55e;stroke-width:1.5;rx:14}.warn{fill:#2a2110;stroke:#f59e0b;stroke-width:1.5;rx:14}</style></defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="text h1" x="60" y="70">02. Minimal Model Picker</text>
  <text class="text small" x="60" y="104">Search and choose. Show one selected-model label. Hide everything else.</text>
  <rect class="box" x="180" y="160" width="840" height="430"/>
  <rect class="search" x="230" y="210" width="740" height="58"/><text class="text small" x="258" y="246">Search open-source LLMs...</text>
  <rect class="active" x="230" y="300" width="740" height="76"/><text class="text h2" x="260" y="334">Qwen 2.5 7B Instruct</text><text class="text tiny" x="260" y="358">estimated runnable • not installed claim</text>
  <rect class="item" x="230" y="394" width="740" height="76"/><text class="text h2" x="260" y="428">Mistral 7B Instruct</text><text class="text tiny" x="260" y="452">catalog example • setup guidance only</text>
  <rect class="item" x="230" y="488" width="740" height="76"/><text class="text h2" x="260" y="522">Model-needed boundary</text><text class="text tiny" x="260" y="546">no execution until runtime/model wiring is connected</text>
  <rect class="pill" x="390" y="622" width="420" height="42"/><text class="text small" x="428" y="649">Selected: Qwen 2.5 7B Instruct</text>
  <rect class="warn" x="830" y="622" width="190" height="42"/><text class="text tiny" x="858" y="648">not a run claim</text>
  <text class="text h2" x="60" y="720">Decision</text>
  <text class="text small" x="60" y="752">Model choice should be a simple picker and label, not a full model-management screen.</text>
</svg>
