<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">KORA Studio v0.7 Minimal Board 02 - Run</title>
  <desc id="desc">Minimal approved request and local harness run board.</desc>
  <defs><style>.bg{fill:#0b0f14}.panel{fill:#10161f;stroke:#2b3544;stroke-width:2;rx:16}.card{fill:#151d28;stroke:#334155;stroke-width:2;rx:12}.active{fill:#172637;stroke:#38bdf8;stroke-width:2;rx:12}.button{fill:#10251f;stroke:#22c55e;stroke-width:2;rx:18}.text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d8e0eb}.h1{font-size:38px;font-weight:760;fill:#f8fafc}.h2{font-size:24px;font-weight:720}.small{font-size:16px;fill:#aeb8c6}.tiny{font-size:13px;fill:#8d9bae}.red{fill:#ef4444}</style></defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="text h1" x="56" y="70">02. Run Local Harness</text>
  <text class="text small" x="56" y="104">One action. One approved request. No prompt box.</text>
  <rect class="panel" x="56" y="150" width="1088" height="470"/>

  <rect class="active" x="96" y="210" width="360" height="290"/>
  <text class="text h2" x="126" y="250">Approved Request</text>
  <text class="text small" x="126" y="296">json-required-fields-001</text>
  <text class="text tiny" x="126" y="326">task: validate JSON fields</text>
  <text class="text tiny" x="126" y="354">route: deterministic</text>
  <text class="text tiny" x="126" y="382">model needed: false</text>
  <rect class="button" x="126" y="424" width="190" height="44"/>
  <text class="text small" x="154" y="452">Run Local Harness</text>

  <rect class="card" x="498" y="210" width="286" height="290"/>
  <text class="text h2" x="528" y="250">Selected Run</text>
  <text class="text small" x="528" y="296">status: completed</text>
  <text class="text small" x="528" y="332">events: 6</text>
  <text class="text small" x="528" y="368">model: not connected</text>
  <text class="text small" x="528" y="404">provider: disabled</text>

  <rect class="card" x="826" y="210" width="278" height="290"/>
  <text class="text h2" x="856" y="250">Do Not Add</text>
  <text class="text small red" x="856" y="296">No arbitrary input</text>
  <text class="text small red" x="856" y="332">No model run</text>
  <text class="text small red" x="856" y="368">No download</text>
  <text class="text small red" x="856" y="404">No provider call</text>

  <text class="text h2" x="56" y="698">Decision</text>
  <text class="text small" x="56" y="730">Default screen should focus on request selection and one local run action.</text>
</svg>
