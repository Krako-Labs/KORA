<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">KORA AI Workload Control Layer Architecture</title>
  <desc id="desc">A clean architecture diagram showing KORA between applications and model providers, routing workloads through deterministic handlers, cache reuse, retrieval, tools, and provider-needed paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 22px Inter, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 13px Inter, Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .kora { fill: #eef2ff; stroke: #4f46e5; stroke-width: 3; rx: 28; filter: url(#shadow); }
      .route { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .safe { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 18; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 18; }
      .model { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 18; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin-line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .pill { fill: #e0e7ff; stroke: #818cf8; stroke-width: 1.5; rx: 14; }
      .pill-text { font: 700 13px Inter, Arial, sans-serif; fill: #3730a3; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <text x="700" y="70" text-anchor="middle" class="title">KORA AI Workload Control Layer</text>
  <text x="700" y="108" text-anchor="middle" class="subtitle">Decide what should reach a model, what can be handled deterministically, and what can be reused.</text>

  <!-- Top flow -->
  <rect x="70" y="170" width="250" height="130" class="box"/>
  <text x="195" y="215" text-anchor="middle" class="label">Applications</text>
  <text x="195" y="245" text-anchor="middle" class="small">Agents · RAG · API apps</text>
  <text x="195" y="270" text-anchor="middle" class="small">OpenAI-style requests</text>

  <rect x="400" y="145" width="600" height="180" class="kora"/>
  <text x="700" y="195" text-anchor="middle" class="section-title">KORA Control Layer</text>
  <text x="700" y="228" text-anchor="middle" class="small">Inspect workload → select route → execute safe path → report evidence</text>
  <rect x="455" y="255" width="130" height="34" class="pill"/>
  <text x="520" y="277" text-anchor="middle" class="pill-text">doctor</text>
  <rect x="610" y="255" width="130" height="34" class="pill"/>
  <text x="675" y="277" text-anchor="middle" class="pill-text">proxy-demo</text>
  <rect x="765" y="255" width="130" height="34" class="pill"/>
  <text x="830" y="277" text-anchor="middle" class="pill-text">examples</text>

  <rect x="1080" y="170" width="250" height="130" class="model"/>
  <text x="1205" y="215" text-anchor="middle" class="label">Provider / Model</text>
  <text x="1205" y="245" text-anchor="middle" class="small">Only when needed</text>
  <text x="1205" y="270" text-anchor="middle" class="small">No call in offline demos</text>

  <path d="M320 235 L395 235" class="line"/>
  <path d="M1005 235 L1075 235" class="line"/>

  <!-- Route selection -->
  <text x="700" y="385" text-anchor="middle" class="section-title">Route Selection</text>
  <path d="M700 325 L700 360" class="line"/>

  <rect x="80" y="430" width="225" height="120" class="safe"/>
  <text x="192" y="470" text-anchor="middle" class="label">Deterministic</text>
  <text x="192" y="500" text-anchor="middle" class="small">classification</text>
  <text x="192" y="524" text-anchor="middle" class="small">validation · transforms</text>

  <rect x="335" y="430" width="225" height="120" class="safe"/>
  <text x="447" y="470" text-anchor="middle" class="label">Cache Reuse</text>
  <text x="447" y="500" text-anchor="middle" class="small">repeat requests</text>
  <text x="447" y="524" text-anchor="middle" class="small">known results</text>

  <rect x="590" y="430" width="225" height="120" class="route"/>
  <text x="702" y="470" text-anchor="middle" class="label">Retrieval Needed</text>
  <text x="702" y="500" text-anchor="middle" class="small">RAG corpus lookup</text>
  <text x="702" y="524" text-anchor="middle" class="small">document-grounded work</text>

  <rect x="845" y="430" width="225" height="120" class="warn"/>
  <text x="957" y="470" text-anchor="middle" class="label">Tool Needed</text>
  <text x="957" y="500" text-anchor="middle" class="small">local action</text>
  <text x="957" y="524" text-anchor="middle" class="small">workflow step</text>

  <rect x="1100" y="430" width="225" height="120" class="model"/>
  <text x="1212" y="470" text-anchor="middle" class="label">Provider Needed</text>
  <text x="1212" y="500" text-anchor="middle" class="small">open-ended reasoning</text>
  <text x="1212" y="524" text-anchor="middle" class="small">generation fallback</text>

  <path d="M700 392 C510 400 280 410 192 430" class="thin-line"/>
  <path d="M700 392 C580 408 490 415 447 430" class="thin-line"/>
  <path d="M700 392 L702 426" class="thin-line"/>
  <path d="M700 392 C820 408 910 415 957 430" class="thin-line"/>
  <path d="M700 392 C900 400 1130 410 1212 430" class="thin-line"/>

  <!-- Evidence layer -->
  <rect x="110" y="645" width="1180" height="130" class="box"/>
  <text x="700" y="690" text-anchor="middle" class="section-title">Evidence and Reporting</text>
  <text x="700" y="723" text-anchor="middle" class="small">Every offline example reports route counts, avoided simulated invocations, provider-needed work, and provider calls actually made.</text>
  <text x="700" y="752" text-anchor="middle" class="tiny">Current examples: Doctor · Deterministic Classification · OpenAI Proxy Demo · RAG Routing · Agent Workflow Optimization · Cache Reuse</text>

  <path d="M192 550 C230 610 330 635 420 645" class="dashed"/>
  <path d="M447 550 C475 610 530 635 580 645" class="dashed"/>
  <path d="M702 550 L702 645" class="dashed"/>
  <path d="M957 550 C925 610 870 635 820 645" class="dashed"/>
  <path d="M1212 550 C1160 610 1060 635 980 645" class="dashed"/>

  <!-- Footer note -->
  <text x="700" y="835" text-anchor="middle" class="tiny">KORA is not a model replacement. It controls workload routing before provider/model invocation.</text>
</svg>
